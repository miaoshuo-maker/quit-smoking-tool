<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f2">
  <title>慢慢戒 | 每一步都算数</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202922;
      --muted: #737c75;
      --line: #e5e9e4;
      --paper: #ffffff;
      --canvas: #f5f5f2;
      --green: #176f52;
      --green-soft: #e8f3ed;
      --coral: #d96850;
      --coral-soft: #fbede8;
      --gold: #b78332;
      --gold-soft: #f7f0df;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .shell { width: min(100% - 36px, 1080px); margin: 0 auto; padding: 25px 0 56px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 34px; }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 700; font-size: 17px; }
    .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; color: white; background: var(--green); font-size: 17px; }
    .top-actions { display: flex; align-items: center; gap: 12px; }
    .local-note { color: var(--muted); font-size: 12px; }
    .icon-button { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: var(--radius); color: var(--ink); background: var(--paper); }
    .icon-button:hover { background: #f0f4f0; }
    .icon-button svg { width: 18px; height: 18px; }
    .intro { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 0 0 22px; }
    .eyebrow { color: var(--green); font-size: 12px; font-weight: 700; margin: 0 0 8px; }
    h1 { font-size: 29px; line-height: 1.2; margin: 0; font-weight: 680; }
    .date { color: var(--muted); font-size: 14px; white-space: nowrap; padding-bottom: 4px; }
    .main-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(280px, 0.95fr); gap: 16px; align-items: stretch; }
    .panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); }
    .today { padding: 25px 26px 23px; min-height: 288px; display: flex; flex-direction: column; }
    .panel-heading { display: flex; align-items: start; justify-content: space-between; gap: 10px; }
    .panel-heading h2 { margin: 0; font-size: 16px; font-weight: 650; }
    .stage { padding: 5px 9px; border-radius: 20px; background: var(--green-soft); color: var(--green); font-size: 12px; white-space: nowrap; }
    .count-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 27px 0 17px; }
    .count-copy { display: flex; align-items: baseline; gap: 9px; }
    .count { font-size: 54px; line-height: 1; letter-spacing: 0; font-weight: 650; font-variant-numeric: tabular-nums; }
    .count-label { font-size: 14px; color: var(--muted); }
    .target-copy { text-align: right; color: var(--muted); font-size: 13px; }
    .target-copy strong { display: block; color: var(--ink); font-size: 22px; font-weight: 650; margin-top: 3px; }
    .meter { height: 8px; border-radius: 20px; background: #edf0ed; overflow: hidden; }
    .meter-fill { height: 100%; width: 0; background: var(--green); border-radius: inherit; transition: width .25s ease; }
    .meter-fill.over { background: var(--coral); }
    .meter-caption { display: flex; justify-content: space-between; margin-top: 8px; color: var(--muted); font-size: 12px; }
    .actions { display: flex; gap: 9px; margin-top: auto; padding-top: 22px; }
    .action { min-height: 43px; padding: 0 15px; border-radius: var(--radius); border: 1px solid var(--line); background: white; color: var(--ink); font-weight: 600; display: inline-flex; gap: 8px; align-items: center; justify-content: center; }
    .action:hover { background: #f7f9f7; }
    .action svg { width: 17px; height: 17px; }
    .action.primary { border-color: var(--green); background: var(--green); color: white; }
    .action.primary:hover { background: #105d44; }
    .action.secondary { border-color: #f1d5cc; background: var(--coral-soft); color: #974632; }
    .action.secondary:hover { background: #f8e4dd; }
    .plan { padding: 24px 23px; background: #f0f5f0; border-color: #e2ebe4; display: flex; flex-direction: column; }
    .plan h2 { font-size: 16px; margin: 0 0 7px; }
    .plan-sub { margin: 0; color: var(--muted); font-size: 13px; }
    .plan-progress { display: flex; align-items: center; gap: 15px; margin: 23px 0 17px; }
    .ring { --p: 0%; flex: 0 0 auto; width: 83px; height: 83px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--green) var(--p), #dce7de var(--p)); position: relative; }
    .ring::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: #f0f5f0; }
    .ring-value { z-index: 1; font-size: 19px; font-weight: 700; }
    .ring-value small { display: block; text-align: center; color: var(--muted); font-size: 10px; font-weight: 500; }
    .plan-progress-copy strong { font-size: 15px; display: block; margin-bottom: 5px; }
    .plan-progress-copy span { color: var(--muted); font-size: 12px; line-height: 1.5; }
    .plan-rule { border-top: 1px solid #dce6de; padding-top: 13px; margin-top: auto; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
    .plan-rule strong { color: var(--ink); font-weight: 600; }
    .lower-grid { display: grid; grid-template-columns: minmax(0, 1.28fr) minmax(280px, .92fr); gap: 16px; margin-top: 16px; }
    .week-panel, .urge-panel { padding: 23px 24px; }
    .section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .section-title h2 { margin: 0; font-size: 16px; }
    .section-title span { color: var(--muted); font-size: 12px; }
    .chart { height: 135px; display: flex; align-items: end; gap: clamp(8px, 2.5vw, 22px); padding: 20px 2px 0; }
    .bar-day { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: end; align-items: center; gap: 7px; }
    .bar-track { height: 84px; width: min(100%, 35px); display: flex; align-items: end; overflow: hidden; background: #f0f2ef; border-radius: 4px 4px 0 0; }
    .bar-fill { width: 100%; min-height: 3px; background: #70a88c; border-radius: 4px 4px 0 0; }
    .bar-fill.today-bar { background: var(--green); }
    .bar-label { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .legend { margin-top: 13px; color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 7px; }
    .legend-mark { width: 9px; height: 9px; border-radius: 2px; background: var(--green); }
    .urge-panel { background: #fffaf1; border-color: #f0e8d6; }
    .urge-panel .section-title h2 { display: flex; align-items: center; gap: 8px; }
    .spark { color: var(--gold); font-size: 19px; }
    .urge-message { margin: 19px 0 16px; font-size: 14px; line-height: 1.55; color: #4d4a3e; min-height: 44px; }
    .urge-button { border: 1px solid #e6d6b6; background: white; color: #66532c; min-height: 40px; border-radius: var(--radius); padding: 0 13px; font-weight: 600; }
    .urge-button:hover { background: var(--gold-soft); }
    .urge-count { margin-left: 9px; color: var(--muted); font-size: 12px; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 14px); opacity: 0; pointer-events: none; transition: .2s ease; max-width: calc(100% - 32px); padding: 12px 16px; background: #202922; color: white; border-radius: var(--radius); box-shadow: 0 8px 24px #0002; font-size: 14px; z-index: 10; }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    dialog { border: 0; border-radius: 10px; padding: 0; width: min(440px, calc(100% - 28px)); color: var(--ink); box-shadow: 0 20px 70px #1c2b2140; }
    dialog::backdrop { background: #17221b66; }
    .dialog-inner { padding: 24px; }
    .dialog-title { margin: 0; font-size: 20px; }
    .dialog-copy { margin: 8px 0 22px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .field { display: block; margin: 0 0 17px; font-size: 13px; font-weight: 600; }
    .field span { display: block; margin-bottom: 7px; }
    .field input { width: 100%; height: 43px; padding: 0 11px; border: 1px solid #d8dfd9; border-radius: 6px; color: var(--ink); background: white; }
    .field input:focus { outline: 2px solid #78a88f; border-color: transparent; }
    .dialog-actions { display: flex; justify-content: end; gap: 9px; margin-top: 22px; }
    .dialog-actions .action { min-width: 82px; }
    @media (max-width: 740px) {
      .shell { width: min(100% - 28px, 560px); padding-top: 17px; }
      .topbar { margin-bottom: 27px; }
      .local-note { display: none; }
      .intro { align-items: start; flex-direction: column; gap: 9px; margin-bottom: 17px; }
      h1 { font-size: 25px; }
      .date { font-size: 13px; }
      .main-grid, .lower-grid { grid-template-columns: 1fr; gap: 12px; }
      .today { min-height: 270px; padding: 21px 19px; }
      .plan { padding: 21px 19px; }
      .week-panel, .urge-panel { padding: 20px 19px; }
      .lower-grid { margin-top: 12px; }
      .count { font-size: 49px; }
      .actions { gap: 8px; }
      .action { padding: 0 11px; font-size: 13px; }
    }
    @media (max-width: 370px) {
      .actions { flex-wrap: wrap; }
      .actions .action { flex: 1 1 auto; }
      .count-row { align-items: start; }
      .target-copy { font-size: 12px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">步</span><span>慢慢戒</span></div>
      <div class="top-actions">
        <span class="local-note">记录仅保存在这台设备</span>
        <button class="icon-button" id="settingsButton" aria-label="调整计划" title="调整计划">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 15 .1.1a1.7 1.7 0 0 1-2.4 2.4l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.3a1.7 1.7 0 0 1-3.4 0v-.2a1.7 1.7 0 0 0-2.9-1.2l-.1.1a1.7 1.7 0 1 1-2.4-2.4l.1-.1a1.7 1.7 0 0 0-1.2-2.9h-.3a1.7 1.7 0 0 1 0-3.4h.2a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a1.7 1.7 0 1 1 2.4-2.4l.1.1a1.7 1.7 0 0 0 2.9-1.2v-.3a1.7 1.7 0 0 1 3.4 0v.2a1.7 1.7 0 0 0 2.9 1.2l.1-.1a1.7 1.7 0 1 1 2.4 2.4l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.3a1.7 1.7 0 0 1 0 3.4h-.2a1.7 1.7 0 0 0-1.2 2.9Z"/></svg>
        </button>
      </div>
    </header>

    <section class="intro">
      <div><p class="eyebrow">按自己的节奏来</p><h1>今天，少一点也算进步。</h1></div>
      <div class="date" id="todayDate"></div>
    </section>

    <section class="main-grid" aria-label="今日计划">
      <article class="panel today">
        <div class="panel-heading"><h2>今日记录</h2><span class="stage" id="stageLabel">第 1 周</span></div>
        <div class="count-row">
          <div class="count-copy"><span class="count" id="smokedCount">0</span><span class="count-label">支已记录</span></div>
          <div class="target-copy">今日计划上限<strong><span id="dailyTarget">16</span> 支</strong></div>
        </div>
        <div class="meter" role="progressbar" aria-label="今日计划完成度"><div class="meter-fill" id="meterFill"></div></div>
        <div class="meter-caption"><span id="meterStatus">每一支都如实记下</span><span id="remainingText">还可记录 16 支</span></div>
        <div class="actions">
          <button class="action primary" id="smokeButton"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>记录抽了一支</button>
          <button class="action" id="undoButton" aria-label="撤销上一支记录" title="撤销上一支记录"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7v5h5"/><path d="M5 16a8 8 0 1 0 1-8L3 12"/></svg>撤销</button>
        </div>
      </article>

      <article class="panel plan">
        <div><h2>我的戒烟计划</h2><p class="plan-sub" id="planSummary">从 16 支开始，慢慢往下走</p></div>
        <div class="plan-progress">
          <div class="ring" id="progressRing"><div class="ring-value"><span id="progressPercent">0</span><small>已走过</small></div></div>
          <div class="plan-progress-copy"><strong id="weekSummary">第 1 周 · 共 12 周</strong><span id="daysSummary">一步一步，走到自己的戒烟日</span></div>
        </div>
        <div class="plan-rule"><span>预计完成</span><strong id="quitDate">—</strong></div>
      </article>
    </section>

    <section class="lower-grid">
      <article class="panel week-panel">
        <div class="section-title"><h2>近 7 天</h2><span id="weekCaption">每天的实际记录</span></div>
        <div class="chart" id="weekChart" aria-label="近七天吸烟记录"></div>
        <div class="legend"><span class="legend-mark"></span><span>实际记录</span></div>
      </article>
      <article class="panel urge-panel">
        <div class="section-title"><h2><span class="spark" aria-hidden="true">✳</span>烟瘾来了</h2><span class="urge-count" id="urgeCount">今天 0 次挺过</span></div>
        <p class="urge-message" id="urgeMessage">先停一下，给自己十分钟。冲动会起，也会慢慢落下。</p>
        <button class="urge-button" id="urgeButton">我挺过了一次</button>
      </article>
    </section>
  </main>

  <dialog id="settingsDialog">
    <form class="dialog-inner" id="settingsForm">
      <h2 class="dialog-title">调整你的计划</h2>
      <p class="dialog-copy">选择适合自己的节奏和开始日期。已记录的数据会保留。</p>
      <label class="field"><span>目前平均每天抽几支</span><input id="baselineInput" type="number" min="1" max="100" step="1" required></label>
      <label class="field"><span>计划用多少周逐步戒掉</span><input id="weeksInput" type="number" min="2" max="52" step="1" required></label>
      <label class="field"><span>计划开始日期</span><input id="startDateInput" type="date" required></label>
      <div class="dialog-actions"><button class="action" type="button" id="cancelSettings">取消</button><button class="action primary" type="submit">保存计划</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const STORAGE_KEY = 'manmanjie-v1';
    const defaultPlan = { baseline: 16, weeks: 12, startDate: dateKey(new Date()), logs: {} };
    let state = loadState();
    let toastTimer;

    function dateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }
    function fromDateKey(key) {
      const [y, m, d] = key.split('-').map(Number);
      return new Date(y, m - 1, d);
    }
    function dayOffset(start, end) {
      return Math.floor((fromDateKey(end) - fromDateKey(start)) / 86400000);
    }
    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved && Number.isFinite(saved.baseline) && Number.isFinite(saved.weeks) && saved.logs) return saved;
      } catch (_) {}
      return structuredClone(defaultPlan);
    }
    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    function todayLog() {
      const key = dateKey(new Date());
      if (!state.logs[key]) state.logs[key] = { smoked: 0, resisted: 0 };
      return state.logs[key];
    }
    function getPlanPosition() {
      const offset = dayOffset(state.startDate, dateKey(new Date()));
      const totalDays = state.weeks * 7;
      return { offset, totalDays, clamped: Math.max(0, Math.min(totalDays, offset)) };
    }
    function getTarget() {
      const { offset, totalDays } = getPlanPosition();
      if (offset < 0) return state.baseline;
      if (offset >= totalDays) return 0;
      return Math.max(0, Math.ceil(state.baseline * (totalDays - offset - 1) / totalDays));
    }
    function shortDate(date) { return new Intl.DateTimeFormat('zh-CN', { month: 'long', day: 'numeric' }).format(date); }
    function render() {
      const now = new Date();
      const todayKey = dateKey(now);
      const log = todayLog();
      const { offset, totalDays, clamped } = getPlanPosition();
      const target = getTarget();
      const completed = offset >= totalDays;
      const week = Math.min(state.weeks, Math.max(1, Math.floor(Math.max(0, offset) / 7) + 1));
      const percent = completed ? 100 : Math.round(clamped / totalDays * 100);
      document.getElementById('todayDate').textContent = new Intl.DateTimeFormat('zh-CN', { weekday: 'long', month: 'long', day: 'numeric' }).format(now);
      document.getElementById('smokedCount').textContent = log.smoked;
      document.getElementById('dailyTarget').textContent = target;
      document.getElementById('stageLabel').textContent = completed ? '计划已完成' : `第 ${week} 周`;
      document.getElementById('meterFill').style.width = `${target === 0 ? (log.smoked ? 100 : 0) : Math.min(100, log.smoked / target * 100)}%`;
      document.getElementById('meterFill').classList.toggle('over', log.smoked > target);
      document.getElementById('meterStatus').textContent = log.smoked <= target ? '每一支都如实记下' : '记录真实情况，明天继续';
      document.getElementById('remainingText').textContent = log.smoked > target ? `比计划多 ${log.smoked - target} 支` : `还可记录 ${Math.max(0, target - log.smoked)} 支`;
      document.getElementById('planSummary').textContent = `从 ${state.baseline} 支开始，慢慢往下走`;
      document.getElementById('weekSummary').textContent = completed ? '你走完了这段计划' : `第 ${week} 周 · 共 ${state.weeks} 周`;
      document.getElementById('daysSummary').textContent = completed ? '每一步都值得记住' : `已经走过 ${clamped} 天，共 ${totalDays} 天`;
      document.getElementById('progressPercent').textContent = percent;
      document.getElementById('progressRing').style.setProperty('--p', `${percent}%`);
      const finishDate = new Date(fromDateKey(state.startDate).getTime() + totalDays * 86400000);
      document.getElementById('quitDate').textContent = shortDate(finishDate);
      document.getElementById('urgeCount').textContent = `今天 ${log.resisted} 次挺过`;
      renderWeek(todayKey, target);
    }
    function renderWeek(todayKey, target) {
      const host = document.getElementById('weekChart');
      const today = fromDateKey(todayKey);
      const items = [];
      let max = Math.max(target, 1);
      for (let i = 6; i >= 0; i--) {
        const d = new Date(today); d.setDate(today.getDate() - i);
        const key = dateKey(d);
        const log = state.logs[key] || { smoked: 0 };
        items.push({ key, label: i === 0 ? '今天' : new Intl.DateTimeFormat('zh-CN', { weekday: 'short' }).format(d), smoked: log.smoked || 0, today: i === 0 });
        max = Math.max(max, log.smoked || 0);
      }
      host.innerHTML = items.map(item => `<div class="bar-day" title="${item.label}：${item.smoked} 支"><div class="bar-track"><div class="bar-fill ${item.today ? 'today-bar' : ''}" style="height:${Math.max(item.smoked ? 4 : 0, item.smoked / max * 100)}%"></div></div><span class="bar-label">${item.label}</span></div>`).join('');
    }
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
    }
    document.getElementById('smokeButton').addEventListener('click', () => {
      todayLog().smoked += 1; save(); render(); showToast('已记录。看见真实的自己，就是进步。');
    });
    document.getElementById('undoButton').addEventListener('click', () => {
      const log = todayLog();
      if (log.smoked > 0) { log.smoked -= 1; save(); render(); showToast('已撤销上一条记录'); }
      else showToast('今天还没有吸烟记录');
    });
    const coping = ['喝几口水，慢慢呼吸五次。', '先离开让你想抽烟的地方，走一小段。', '把冲动拖延十分钟，做一件手边的小事。', '给信任的人发条消息，告诉他你正在撑过这一刻。'];
    document.getElementById('urgeButton').addEventListener('click', () => {
      const log = todayLog(); log.resisted += 1; save(); render();
      document.getElementById('urgeMessage').textContent = coping[(log.resisted - 1) % coping.length];
      showToast('这一次，你陪自己挺过去了。');
    });
    const dialog = document.getElementById('settingsDialog');
    document.getElementById('settingsButton').addEventListener('click', () => {
      document.getElementById('baselineInput').value = state.baseline;
      document.getElementById('weeksInput').value = state.weeks;
      document.getElementById('startDateInput').value = state.startDate;
      dialog.showModal();
    });
    document.getElementById('cancelSettings').addEventListener('click', () => dialog.close());
    document.getElementById('settingsForm').addEventListener('submit', event => {
      event.preventDefault();
      state.baseline = Math.max(1, Math.min(100, Number(document.getElementById('baselineInput').value)));
      state.weeks = Math.max(2, Math.min(52, Number(document.getElementById('weeksInput').value)));
      state.startDate = document.getElementById('startDateInput').value || dateKey(new Date());
      save(); dialog.close(); render(); showToast('新计划从今天开始');
    });
    render();
  </script>
</body>
</html>
